# Screening profile: dsx-ai-factory/nvke
#
# Label vocabulary MEASURED 2026-11-11 on 121 open issues (not guessed):
#   priority/P0 3, P1 35, P2 36 (+47 needs-triage = no priority yet)
#   kind:  feature 75, bug 23, documentation 8
#   area/* controller 37, os-image 35, cli 19, ci-build 12, agent 8, chart 7, docs 4, auth 4, nktp 2
#   good first issue 4, help wanted 4, roadmap/exploring 4, roadmap/working-on-it 1
# This is neither the kubernetes/prow vocabulary (no kind/*, lifecycle/*) nor the
# area-component one: there IS a priority ladder, but it is P0..P2 and set by a
# triager (docs/issue-triage.md), so `needs-triage` means "no maintainer has looked".
#
# Keys left empty on purpose:
#   - no lifecycle/stale bot exists -> SKIP_LABELS carries only the closed-reason labels.
#   - no KEP process -> PROCESS_LABELS empty; PROCESS_ARTIFACT is a design comment/issue
#     (CONTRIBUTING.md: "post about your intended feature, and we shall discuss the design").

SKIP_LABELS="wontfix,duplicate,invalid,question,needs-info"
PROPOSAL_LABELS="roadmap/exploring"
PROCESS_LABELS=""
INVITE_LABELS="good first issue,help wanted"

PRIORITY_PREFIX="priority/"
PRIORITY_ORDER="P0,P1,P2"
PROCESS_ARTIFACT="design comment on the issue"
