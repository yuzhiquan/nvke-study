# Screening profile: generic GitHub project (no prow, no kind/* or priority/*)
#
# Sensible default for the majority of open-source repos, which use flat labels
# like "bug", "enhancement", "docs", "good first issue". Verified against
# pallets/flask, whose full label set is: async, auto-closed, blocker,
# blueprints, bug, cli, dependencies, discussion, docs, ... typing.

SKIP_LABELS="wontfix,invalid,duplicate,auto-closed,stale,question,discussion"
PROPOSAL_LABELS="rfc,proposal,design"
PROCESS_LABELS="breaking-change,api"
INVITE_LABELS="good first issue,help wanted,contributions welcome,hacktoberfest"

# Most projects have no priority label taxonomy at all.
PRIORITY_PREFIX=""
PRIORITY_ORDER=""
PROCESS_ARTIFACT="design discussion"
