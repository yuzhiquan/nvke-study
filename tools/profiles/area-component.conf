# Screening profile: projects using area/* + component/* taxonomies
#
# Verified against prometheus/prometheus (area/build, component/api, ...) and
# grafana/grafana (area/access-control, area/alerting/*, ...). These projects
# have rich area labels but usually no priority/* ladder, so priority ranking is
# disabled and INVITE_LABELS does the ranking work.

SKIP_LABELS="stale,wontfix,duplicate,invalid,needs-more-info"
PROPOSAL_LABELS="proposal,rfc,design-doc"
PROCESS_LABELS="breaking-change,api-change"
INVITE_LABELS="good first issue,help wanted,contributor-friendly"

PRIORITY_PREFIX=""
PRIORITY_ORDER=""
PROCESS_ARTIFACT="proposal"
