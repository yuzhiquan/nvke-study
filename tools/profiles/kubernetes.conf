# Screening profile: Kubernetes / CNCF projects (prow-based)
#
# Label vocabulary for repos following the Kubernetes community conventions:
# kind/*, priority/*, lifecycle/*, "help wanted", "good first issue".
# Used by kubernetes-sigs/*, kubernetes/*, and most CNCF sub-projects.
#
# Copy this file to make a profile for another ecosystem; every key is optional
# and an unset key simply disables that heuristic.

# Labels that mark an issue as not worth planning (stale/frozen/duplicate).
# Matched as substrings against the comma-joined label list.
SKIP_LABELS="lifecycle/rotten,lifecycle/frozen,lifecycle/stale"

# Labels that mean "the deliverable is a proposal/design, not code".
PROPOSAL_LABELS="priority/awaiting-more-evidence"

# Labels that imply extra process (a design doc / KEP / RFC) before coding.
PROCESS_LABELS="kind/api-change"

# Labels that signal maintainers actively want outside help. Ranked first.
INVITE_LABELS="help wanted,good first issue"

# Priority label prefix, used by --min-priority. Empty disables priority filtering.
PRIORITY_PREFIX="priority/"

# Ordered best-to-worst priority values (after the prefix). Used for ranking.
PRIORITY_ORDER="critical-urgent,important-soon,important-longterm,backlog"

# Name of the process artifact, purely for human-readable output.
PROCESS_ARTIFACT="KEP"
